[package]
name = "gllia"
version = "1.1.0"
edition = "2021"
description = "Launcher de patchs de traduction de la team Saint Eresia"

# Launcher prévu pour Windows (détection Steam/GOG via le registre).
[dependencies]
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["image", "file", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rodio = "0.20"
dirs = "6"
rfd = "0.15"
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
